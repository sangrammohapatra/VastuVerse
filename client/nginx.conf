# VastuVerse client nginx config.
#
# Listens on 80 (HTTP → HTTPS redirect) and 443 (TLS) when certs are mounted
# from /etc/letsencrypt. If certs aren't present yet, comment out the 443
# server block and serve plain HTTP from 80 — the certbot bootstrap flow
# usually needs that on the first run.
#
# Routing:
#   /api/v1/*       → proxy_pass to server:5000 (internal Docker network)
#   /socket.io/*    → WebSocket upgrade to server:5000
#   /assets/*       → static, Cache-Control: 1yr immutable (hashed by Vite)
#   /locales/*      → static, Cache-Control: 1h (translations may update)
#   /*              → try_files → /index.html (SPA fallback)
#
# Performance:
#   - gzip on for text/CSS/JS/SVG/JSON (>1KB) — saves ~70% on bundle bytes
#   - HTTP/2 enabled on 443
#   - keepalive to upstream server for connection reuse

# ─── Map: $http_upgrade → $connection_upgrade (needed for WebSocket) ─
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── HTTP → HTTPS redirect (and ACME challenge) ─────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check (used by docker-compose healthcheck on port 80)
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS server ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name _;

    # TLS — mounted from host. Replace example domain.
    ssl_certificate     /etc/letsencrypt/live/vastuverse.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vastuverse.app/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /usr/share/nginx/html;
    index index.html;

    # ─── Security headers (helmet at the API server too) ───────────
    add_header X-Frame-Options          "DENY" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ─── Compression ───────────────────────────────────────────────
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_comp_level    6;
    gzip_proxied       any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ─── Body size — matches server's express.json 10MB limit ───────
    client_max_body_size 20m;

    # ─── Upstream API ──────────────────────────────────────────────
    location /api/v1/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        # No buffering for SSE / streaming AI responses
        proxy_buffering       off;
    }

    # ─── Socket.io with WebSocket upgrade ──────────────────────────
    location /socket.io/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;       # long-lived connections
    }

    # ─── Hashed Vite assets — 1 year immutable cache ───────────────
    # Vite names assets like `index-abc123.js`; safe to cache forever
    # because a code change produces a new filename.
    location /assets/ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files  $uri =404;
    }

    # ─── Translation files (i18next) — 1 hour cache ────────────────
    # Not hashed; we want translation fixes to ship reasonably fast.
    location /locales/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # ─── PWA manifest, service worker, robots — short cache ────────
    location ~* \.(?:webmanifest|json)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # ─── Other static files (images, fonts) — 30 days ──────────────
    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|eot)$ {
        access_log off;
        expires    30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files  $uri =404;
    }

    # ─── SPA fallback ──────────────────────────────────────────────
    # Anything else: serve the file if it exists, otherwise index.html.
    # The HTML file itself is NEVER cached so a deploy is picked up on
    # the next page load even with hashed assets still in user CDN cache.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html — must not cache so users always see the latest deploy
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
    }

    # ─── Health (for docker-compose healthcheck on port 443) ───────
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
