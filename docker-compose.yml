version: '3.9'

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: vastuverse-client
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api/v1
      - VITE_SOCKET_URL=http://localhost:5000
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vastuverse-server
    ports:
      - "5000:5000"
    # Requires ./server/.env to exist (copy it from .env.example first).
    env_file:
      - ./server/.env
    # Container-network overrides so the API reaches sibling services by name.
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/vastuverse
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./server/src:/app/src
      - ./server/uploads:/app/uploads
    depends_on:
      - mongo
      - redis
      - ollama
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: vastuverse-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vastuverse-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: vastuverse-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  mongo_data:
  ollama_data:
