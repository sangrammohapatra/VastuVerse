# Production stack for VastuVerse.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Service topology:
#   client (nginx)  exposed on :80 / :443   — serves /dist + proxies /api/v1 → server
#   server (node)   internal only           — PM2 cluster, 4 workers
#   mongo           internal only           — replica set primary, persistent volume
#   redis           internal only           — BullMQ + rate-limit + socket.io adapter
#
# Notes:
#   - All secrets come from .env.prod (NOT committed)
#   - mongo + redis have NO published ports — only reachable via the
#     `vastuverse-net` bridge network from server / nginx containers
#   - server healthcheck pulls /api/v1/health every 30s; compose marks
#     it unhealthy after 3 consecutive failures
#   - nginx waits for server to be `service_healthy` before starting

version: "3.9"

networks:
  vastuverse-net:
    driver: bridge

volumes:
  mongo-data:
  mongo-config:
  redis-data:
  server-logs:

services:
  # ─── MongoDB ─────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: vastuverse-mongo
    restart: unless-stopped
    networks: [vastuverse-net]
    # NO ports — only reachable from inside the bridge network
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: vastuverse
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    command: ["--bind_ip", "0.0.0.0", "--auth"]
    deploy:
      resources:
        limits: { memory: 2g }

  # ─── Redis (BullMQ + rate-limit + socket.io adapter) ─────────────
  redis:
    image: redis:7.2-alpine
    container_name: vastuverse-redis
    restart: unless-stopped
    networks: [vastuverse-net]
    # NO ports
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD}
      - --appendonly yes
      - --maxmemory 512mb
      - --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 768m }

  # ─── API server (PM2 cluster) ────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    image: vastuverse-server:latest
    container_name: vastuverse-server
    restart: unless-stopped
    networks: [vastuverse-net]
    # NO published ports — nginx talks to it on the internal network
    environment:
      NODE_ENV: production
      PORT: 5000
      LOG_LEVEL: info
      TRUST_PROXY: "1"

      # Mongo
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/vastuverse?authSource=admin
      MONGO_POOL_SIZE: "50"

      # Redis
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379

      # JWT + session
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL: "15m"
      REFRESH_TOKEN_TTL: "30d"

      # OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}

      # Email (SMTP)
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM: ${EMAIL_FROM}

      # Razorpay
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}

      # AI providers
      AI_PLAN_PROVIDER: ${AI_PLAN_PROVIDER}
      AI_IMAGE_PROVIDER: ${AI_IMAGE_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_PLAN_MODEL: ${OPENAI_PLAN_MODEL}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL}
      OLLAMA_URL: ${OLLAMA_URL}
      AI_WORKER_CONCURRENCY: "4"

      # WhatsApp (optional)
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL}

      # CORS
      CLIENT_URL: ${CLIENT_URL}
      APP_URL: ${CLIENT_URL}
    volumes:
      - server-logs:/app/logs
    depends_on:
      mongo:    { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      # Reaches /api/v1/health which pings mongo + redis + queue
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 2g, cpus: "2.0" }

  # ─── Web (nginx serving the built SPA + reverse proxy) ───────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${CLIENT_URL}/api/v1
    image: vastuverse-client:latest
    container_name: vastuverse-client
    restart: unless-stopped
    networks: [vastuverse-net]
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # SSL certs from host (Let's Encrypt via certbot)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    deploy:
      resources:
        limits: { memory: 256m }
